services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voice
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  voice-api:
    build:
      context: .
      target: cpu
    # ./data — bind mount, который Docker может создать от root. API запускается
    # от root, чтобы создать ./data/audio в чистом клоне репозитория.
    user: "0:0"
    ports:
      - "18080:18080"
    volumes:
      - ./models:/models:ro
      - ./data:/app/data
    environment:
      DATABASE_URL: postgres://voice:voice@postgres:5432/voice?sslmode=disable
      UPLOAD_DIR: /app/data/audio
      WORKERS: ${WORKERS:-2}
      QUEUE_SIZE: ${QUEUE_SIZE:-50}
      WHISPER_THREADS: ${WHISPER_THREADS:-6}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
